[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-shrinkage-benchmark"
version = "0.1.0"
description = "A reproducible simulation benchmark of ridge-type, LASSO and robust-first estimators under multicollinearity and outlier contamination."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christian Nnaemeka Nwaeme" }]
dependencies = ["numpy>=1.21", "scikit-learn>=1.0", "pandas>=1.3"]

[tool.setuptools]
packages = ["robust_shrinkage_benchmark"]
